<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b0f0d">
  <title>{% block title %}Admin · TTURFZONE{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body class="admin-body">
  {% if admin %}
  <header class="admin-top">
    <div class="admin-top__inner">
      <a class="admin-brand" href="{{ url_for('admin.dashboard') }}">TTURFZONE admin</a>
      <nav class="admin-nav" aria-label="Admin">
        <a href="{{ url_for('admin.dashboard') }}">Dashboard</a>
        <a href="{{ url_for('admin.bookings') }}">Bookings</a>
        <a href="{{ url_for('admin.calendar') }}">Calendar</a>
      </nav>
      <form method="post" action="{{ url_for('admin.logout') }}" class="admin-logout">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit" class="btn btn--ghost">Sign out</button>
      </form>
    </div>
  </header>
  {% endif %}

  <main class="admin-main" id="main">
    <div class="admin-wrap">
      {% with messages = get_flashed_messages() %}
        {% for message in messages %}<p class="flash">{{ message }}</p>{% endfor %}
      {% endwith %}
      {% block content %}{% endblock %}
    </div>
  </main>
</body>
</html>

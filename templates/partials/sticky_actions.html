{# Persistent mobile actions (brief §11): WHATSAPP + BOOK NOW.
   Hidden at >=900px, where the floating WhatsApp button takes over. #}
<div class="sticky-actions" data-sticky-actions>
  {% if wa_link %}
    <a class="btn btn--whatsapp" href="{{ wa_link }}" rel="noopener" target="_blank">WhatsApp</a>
  {% else %}
    <a class="btn btn--whatsapp" aria-disabled="true" title="WhatsApp number not set yet (C-06)">WhatsApp</a>
  {% endif %}
  <a class="btn btn--primary" href="#book">Book now</a>
</div>

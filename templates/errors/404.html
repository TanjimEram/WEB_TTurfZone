{% extends "base.html" %}
{% block title %}Page not found · TTURFZONE{% endblock %}

{% block content %}
<main id="main" class="section">
  <div class="container stack error-page">
    <p class="section__label">404</p>
    <h1 class="section__title">We can't find that page</h1>
    <p class="muted">The link may be old or mistyped.</p>
    <p>
      <a class="btn btn--primary" href="{{ url_for('public.home') }}">Go to the homepage</a>
      <a class="btn btn--ghost" href="{{ url_for('public.book') }}">Book a slot</a>
    </p>
  </div>
</main>
{% endblock %}

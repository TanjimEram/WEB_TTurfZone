<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0f0d">
  <meta name="description" content="{% block description %}{{ settings.tagline if settings and settings.tagline and 'TODO' not in settings.tagline else 'Book a slot at TTURFZONE turf ground.' }}{% endblock %}">
  <title>{% block title %}TTURFZONE{% endblock %}</title>
  <link rel="canonical" href="{{ request.url }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='icons/favicon-32.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ settings.turf_name if settings and settings.turf_name else 'TTURFZONE' }}">
  <meta property="og:title" content="{{ self.title() }}">
  <meta property="og:description" content="{{ self.description() }}">
  <meta property="og:url" content="{{ request.url }}">
  <meta property="og:image" content="{{ url_for('static', filename='images/og-image.jpg', _external=True) }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="T Turf Zone logo next to the floodlit pitch at night">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  {% block json_ld %}{% endblock %}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {% with messages = get_flashed_messages() %}
    {% if messages %}
    <div class="flash-region" role="status" aria-live="polite">
      {% for message in messages %}<p class="flash">{{ message }}</p>{% endfor %}
    </div>
    {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
